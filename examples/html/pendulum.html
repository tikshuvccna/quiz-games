<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מטוטלת</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Heebo', system-ui, sans-serif; background: #eaf6ff; color: #1b1340; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px; font-size: clamp(1.1rem, 3.4vw, 1.8rem); font-weight: 900; text-align: center; background: #1b1340; color: #fff; }
  canvas { flex: 1; min-height: 0; width: 100%; display: block; background: linear-gradient(#cfeaff, #eaf6ff); touch-action: none; }
  .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; padding: 10px 14px; background: #fff; box-shadow: 0 -4px 12px rgba(0, 0, 0, .12); }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 800; font-size: clamp(.9rem, 2.4vw, 1.15rem); }
  input[type=range] { width: 100%; height: 34px; accent-color: #8b5cf6; }
  .read { display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; font-size: clamp(1rem, 2.8vw, 1.5rem); background: #f4efff; border-radius: 14px; padding: 6px; }
  .read small { font-weight: 700; opacity: .7; }
  button { font: inherit; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #ffd23f; color: #3a2d00; box-shadow: 0 4px 0 #b37a00; cursor: pointer; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b37a00; }
</style>
</head>
<body>
<header>🕰️ מטוטלת: מה משפיע על זמן התנודה?</header>
<canvas id="c"></canvas>
<div class="panel">
  <label>אורך החוט: <span id="lv"></span> מ'<input id="len" type="range" min="0.3" max="3" step="0.1" value="1.5"></label>
  <label>כוח הכובד: <span id="gv"></span> מ'/ש²<input id="gr" type="range" min="1.6" max="25" step="0.1" value="9.8"></label>
  <div class="read"><span id="per">—</span><small>זמן תנודה מחושב (שניות)</small></div>
  <div class="read"><span id="mes">—</span><small>זמן שנמדד כאן (שניות)</small></div>
  <button id="drop">⬅ משחררים מזווית חדשה</button>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const len = document.getElementById('len'), gr = document.getElementById('gr');
let W, H, th0 = 0.6, th = 0.6, om = 0, last = performance.now(), lastCross = 0, crossings = [];
function size() { const r = c.getBoundingClientRect(); W = c.width = r.width; H = c.height = r.height; }
addEventListener('resize', size); size();
function labels() {
  document.getElementById('lv').textContent = (+len.value).toFixed(1);
  document.getElementById('gv').textContent = (+gr.value).toFixed(1);
  document.getElementById('per').textContent = (2 * Math.PI * Math.sqrt(len.value / gr.value)).toFixed(2);
}
len.oninput = gr.oninput = () => { labels(); crossings = []; };
labels();
document.getElementById('drop').onclick = () => { th0 = th = 0.6 + Math.random() * 0.4; om = 0; crossings = []; document.getElementById('mes').textContent = '—'; };
// drag the bob with the finger or the mouse
let drag = false;
const pivot = () => ({ x: W / 2, y: H * 0.12 });
function setFromPointer(e) { const p = pivot(); const r = c.getBoundingClientRect(); const x = e.clientX - r.left - p.x, y = e.clientY - r.top - p.y; th = Math.max(-1.3, Math.min(1.3, Math.atan2(x, y))); om = 0; }
c.addEventListener('pointerdown', (e) => { drag = true; crossings = []; setFromPointer(e); c.setPointerCapture(e.pointerId); });
c.addEventListener('pointermove', (e) => { if (drag) setFromPointer(e); });
c.addEventListener('pointerup', () => { drag = false; });
function frame(now) {
  const dt = Math.min(0.03, (now - last) / 1000); last = now;
  if (!drag) {
    const L = +len.value, G = +gr.value;
    // a few small steps per frame keep the pendulum accurate
    for (let i = 0; i < 4; i++) { const a = -(G / L) * Math.sin(th); om += a * dt / 4; th += om * dt / 4; }
    om *= 0.9998;
    // time between two passes through the middle in the same direction = one full swing
    if (th > 0 && c.prev !== undefined && c.prev <= 0 && om > 0) { crossings.push(now); if (crossings.length > 1) document.getElementById('mes').textContent = ((crossings[crossings.length - 1] - crossings[crossings.length - 2]) / 1000).toFixed(2); }
    c.prev = th;
  }
  const p = pivot(), scale = Math.min(W / 4, (H * 0.8) / 3.2), R = +len.value * scale;
  const bx = p.x + Math.sin(th) * R, by = p.y + Math.cos(th) * R;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#1b1340'; g.fillRect(p.x - 70, p.y - 14, 140, 14);
  // the faint path
  g.strokeStyle = 'rgba(139,92,246,.25)'; g.lineWidth = 3; g.setLineDash([6, 8]); g.beginPath(); g.arc(p.x, p.y, R, Math.PI / 2 - 1.3, Math.PI / 2 + 1.3); g.stroke(); g.setLineDash([]);
  g.strokeStyle = '#444'; g.lineWidth = 3; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(bx, by); g.stroke();
  const grad = g.createRadialGradient(bx - 8, by - 8, 4, bx, by, 30); grad.addColorStop(0, '#ffe9a8'); grad.addColorStop(1, '#e6a400');
  g.fillStyle = grad; g.beginPath(); g.arc(bx, by, 28, 0, 7); g.fill(); g.strokeStyle = '#7a4a00'; g.lineWidth = 3; g.stroke();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
